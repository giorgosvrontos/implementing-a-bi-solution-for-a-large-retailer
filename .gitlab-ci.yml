stages:
  - validate
  - deploy

default:
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y curl unzip
    - curl -fsSL -o databricks.zip https://github.com/databricks/cli/releases/download/v1.9.0/databricks_cli_1.9.0_linux_amd64.zip
    - unzip databricks.zip
    # Μεταφορά του εκτελέσιμου στον φάκελο του συστήματος για να αναγνωρίζεται η εντολή 'databricks'
    - mv databricks /usr/local/bin/
    # Επιβεβαίωση της εγκατεστημένης έκδοσης στα logs του GitLab
    - databricks --version

# Βήμα 1: Επικύρωση του κώδικα (Έλεγχος για συντακτικά λάθη στο bundle)
validate_bundle:
  stage: validate
  script:
    - databricks bundle validate

# Βήμα 2: Ανάπτυξη στο DEV περιβάλλον (Τρέχει ΜΟΝΟ στο δικό σου branch)
deploy_to_dev_giorgos:
  stage: deploy
  script:
    - export DATABRICKS_TOKEN=$DATABRICKS_TOKEN_GIORGOS
    - databricks bundle deploy -t dev_giorgos
  only:
    - vrontos-develop

deploy_to_dev_charis:
  stage: deploy
  script:
    - export DATABRICKS_TOKEN=$DATABRICKS_TOKEN_CHARIS
    - databricks bundle deploy -t dev_charis
  only:
    - Christakidis_Develop

deploy_to_prod:
  stage: deploy
  script:
    - databricks bundle deploy -t prod
  only:
    - main