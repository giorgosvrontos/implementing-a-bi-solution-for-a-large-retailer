bundle:
  name: large_retailer_pipeline

resources:
  jobs:
    medallion_architecture_job:
      name: "Retailer_Medallion_Pipeline"
      schedule:
        quartz_cron_expression: "0 0 22 * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      tasks:
        # PIPELINE 1: SUPERSTORE.CSV
        - task_key: superstore_bronze_ingestion  
          notebook_task:
            notebook_path: "../superstore.csv_batch_ingestion.ipynb" 

        - task_key: superstore_silver_transformation  
          depends_on:
            - task_key: superstore_bronze_ingestion
          notebook_task:
            notebook_path: "../superstore.csv_bronze_to_silver.ipynb"

        - task_key: superstore_silver_data_quality  
          depends_on:
            - task_key: superstore_silver_transformation
          notebook_task:
            notebook_path: "../superstore.csv_data_quality_check.ipynb"

        # PIPELINE 2: POS DATA 
        - task_key: pos_bronze_ingestion
          notebook_task:
            notebook_path: "../bronze_pos_load.ipynb"

        - task_key: pos_silver_transformation
          depends_on:
            - task_key: pos_bronze_ingestion
          notebook_task:
            notebook_path: "../silver_pos_sales.ipynb"

        - task_key: pos_data_quality
          depends_on:
            - task_key: pos_silver_transformation
          notebook_task:
            notebook_path: "../pos_data_quality_check.ipynb"
        
        # PIPELINE 3: GOLD LAYER 
        - task_key: gold_star_schema  
          depends_on:
            - task_key: superstore_silver_data_quality
            - task_key: pos_data_quality 
          notebook_task:
            notebook_path: "../silver_to_gold_layer.ipynb"